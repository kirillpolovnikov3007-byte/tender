name: Rostender Parser Bot

on:
  schedule:
    - cron: '45 6 * * *' # Запуск каждый день в 06:45 UTC (09:45 по МСК)
  workflow_dispatch: # Кнопка для ручного запуска в любое время

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка кода
        uses: actions/checkout@v4.2.2

      - name: Распаковка оригинального парсера
        run: |
          unzip parser.zip
          if [ -d "parser" ]; then
            mv parser/* .
            rm -rf parser
          elif [ -d "rostender-parse-main" ]; then
            mv rostender-parse-main/* .
            rm -rf rostender-parse-main
          fi
          rm -f parser.zip

      - name: Настройка Python
        uses: actions/setup-python@v5.3.0

      - name: Установка зависимостей
        run: |
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Внедрение кода отправки в Telegram
        run: |
          # Перезаписываем КОРНЕВОЙ файл main.py
          cat << 'EOF' > main.py
          import os
          import sys
          import json
          import logging

          # Добавляем текущую директорию в пути Python
          sys.path.insert(0, os.path.abspath(os.path.dirname(__file__)))

          from telegram_notifier import check_and_notify_tenders
          logging.basicConfig(level=logging.INFO)

          def main():
              try:
                  # Вызываем оригинальный парсинг
                  from src.stages.params import PipelineParams
                  from src.stages.search_active import run as run_search
                  run_search(PipelineParams())
              except Exception as e:
                  logging.warning(f"Оригинальный запуск завершился или пропущен: {e}")
              
              # Ищем собранные тендеры в папке data
              paths_to_check = [
                  "data/active_tenders.json", 
                  "src/data/active_tenders.json"
              ]
              for path in paths_to_check:
                  if os.path.exists(path):
                      with open(path, "r", encoding="utf-8") as f:
                          check_and_notify_tenders(json.load(f))
                      return
              logging.warning("Файл с тендерами не найден. Возможно, парсер ничего не собрал.")

          if __name__ == "__main__":
              main()
          EOF

      - name: Запуск парсера
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py # Запускаем из корня, а не из src!

      - name: Сохранение базы отправленных тендеров
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Обновление базы отправленных тендеров [skip ci]"
          file_pattern: 'sent_tenders.json'
